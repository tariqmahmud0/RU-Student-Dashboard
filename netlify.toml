[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/proxy/*"
  to = "https://eresult.ru.ac.bd:9603/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/ru-profile/*"
  to = "https://profile.ru.ac.bd/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
